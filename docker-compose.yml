# Singing Video Generator — Docker Compose
# Single service: web (Next.js). SQLite, uploads and renders all live in ./data.
#
# Lyric recognition and alignment run against external APIs (MiniMax ASR and
# the lrc.cx lyrics library), so no local ML container is needed.

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=file:/data/sqlite.db
      - UPLOADS_DIR=/data/uploads
      - RENDERS_DIR=/data/renders
    restart: unless-stopped
